[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aislant-music"
version = "0.1.0"
description = "A music intelligence lab exploring how code listens, writes, and performs."
readme = "README.md"
authors = [
    { name = "Ventus Aislant (为何等闲度春风)", email = "ai.ventus.aislant@gmail.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Ubuntu",
]
dependencies = [
    "mido==1.3.3",
    "pydub==0.25.1",
    "notebook==7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
"Homepage" = "https://github.com/VentusAislant/aislant-music"

[tool.setuptools.packages.find]
include = ["aislant_music*"]
exclude = ["playground*"]

[tool.setuptools.package-data]
"aislant_music.music_generator.resources" = ["*.sf2"]

[tool.wheel]
exclude = ["playground*"]
